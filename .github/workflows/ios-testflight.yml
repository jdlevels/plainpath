name: iOS — Build & Upload to TestFlight

# ─── Triggers ────────────────────────────────────────────────────────────────
# Runs automatically on every push to main/master.
# Can also be triggered manually from the GitHub Actions tab (workflow_dispatch).

on:
  push:
    branches: [main, master]
    paths:
      - 'artifacts/plainpath/**'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:
    inputs:
      bump_build:
        description: 'Force build number bump'
        required: false
        default: 'true'

# ─── Required GitHub Secrets ─────────────────────────────────────────────────
#
# Set all of these at: GitHub repo → Settings → Secrets → Actions
#
#  Code signing (from your Apple Developer account):
#    BUILD_CERTIFICATE_BASE64      — Distribution certificate (.p12) as base64
#                                    (base64 -i Certificates.p12 | pbcopy on Mac)
#    P12_PASSWORD                  — Password you set when exporting the .p12
#    BUILD_PROVISION_PROFILE_BASE64 — App Store provisioning profile as base64
#                                    (base64 -i PlainPath.mobileprovision | pbcopy)
#    PROVISIONING_PROFILE_NAME     — Exact name of the profile from Apple Dev portal
#                                    (e.g. "PlainPath App Store")
#    APPLE_TEAM_ID                 — Your 10-character team ID (e.g. "ABC123DEF4")
#    KEYCHAIN_PASSWORD             — Any random string, e.g. "build-keychain-pw"
#
#  App Store Connect API (from Users and Access → Integrations → App Store Connect API):
#    APP_STORE_CONNECT_API_KEY_ID       — Key ID (10 chars, e.g. "ABCD123456")
#    APP_STORE_CONNECT_API_ISSUER_ID    — Issuer ID (UUID format)
#    APP_STORE_CONNECT_API_KEY_BASE64   — Contents of the .p8 key file as base64
#                                         (base64 -i AuthKey_XXXX.p8 | pbcopy)
#
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  build-and-upload:
    name: Build & Upload to TestFlight
    runs-on: macos-14        # Apple Silicon — fastest available macOS runner

    steps:

      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. pnpm (must come before setup-node so the cache key resolves) ────────
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # ── 3. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 4. Install workspace dependencies ───────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 4. Build web assets ─────────────────────────────────────────────────
      # Produces: artifacts/plainpath/dist/public/
      - name: Build PlainPath web app
        run: pnpm --filter @workspace/plainpath build

      # ── 5. Sync into iOS project ─────────────────────────────────────────────
      # Copies dist/public/ → ios/App/App/public/ (gitignored, must be generated)
      # Also updates Package.swift with plugin list including RevenueCat 13.0.1
      # Uses pnpm exec (not npx) to run the workspace-installed @capacitor/cli,
      # preventing npx from downloading a different version that may require newer Node.
      - name: Capacitor sync iOS
        run: pnpm --filter @workspace/plainpath exec cap sync ios

      # ── 6. Bump build number ─────────────────────────────────────────────────
      # Uses the GitHub Actions run number so every build is unique.
      # App Store Connect rejects builds with duplicate build numbers.
      - name: Bump build number
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          echo "Setting build number to: $BUILD_NUMBER"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion $BUILD_NUMBER" \
            artifacts/plainpath/ios/App/App/Info.plist

      # ── 7. Import distribution certificate ──────────────────────────────────
      - name: Import distribution certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH \
            -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      # ── 8. Import provisioning profile ──────────────────────────────────────
      - name: Import provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      # ── 9. Write ExportOptions.plist ─────────────────────────────────────────
      - name: Write ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.plainpathapp.plainpath</key>
              <string>${PROVISIONING_PROFILE_NAME}</string>
            </dict>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      # ── 10. Archive ──────────────────────────────────────────────────────────
      - name: Build Xcode archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          xcodebuild archive \
            -project artifacts/plainpath/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/PlainPath.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            -allowProvisioningUpdates \
            | grep -E 'error:|warning:|\*\* ARCHIVE|Build succeeded|Build FAILED' \
            || true
          
          # Fail the step explicitly if archive is missing
          test -d $RUNNER_TEMP/PlainPath.xcarchive || (echo "Archive not found — build failed" && exit 1)

      # ── 11. Export IPA ───────────────────────────────────────────────────────
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/PlainPath.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            | grep -E 'error:|** EXPORT|Export succeeded|Export FAILED' \
            || true

          # List what was exported for verification
          echo "=== Exported files ==="
          ls -lh $RUNNER_TEMP/export/

      # ── 12. Upload to TestFlight ─────────────────────────────────────────────
      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode \
            > ~/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

          xcrun altool --upload-app \
            -f $RUNNER_TEMP/export/PlainPath.ipa \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            --verbose

      # ── 13. Cleanup ──────────────────────────────────────────────────────────
      - name: Clean up keychain and profile
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision 2>/dev/null || true
          rm -f ~/.private_keys/AuthKey_*.p8 2>/dev/null || true

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("plainpath-theme") || "system";
          if (t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PlainPath — Turn any document into a clear action plan</title>
    <meta name="description" content="PlainPath reads your paperwork and gives you a prioritized action plan — every required step, document, deadline, and risk — in plain English. Free to use, no account required." />
    <meta name="theme-color" content="#4F7CAC" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://plainpathapp.com/app/" />
    <meta property="og:title" content="PlainPath — Turn any document into a clear action plan" />
    <meta property="og:description" content="Analyze any paperwork, verify its legitimacy, build contracts, and review agreements before you sign — all in plain English. Free to start, no account required." />
    <meta property="og:image" content="https://plainpathapp.com/app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="PlainPath" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://plainpathapp.com/app/" />
    <meta name="twitter:title" content="PlainPath — Turn any document into a clear action plan" />
    <meta name="twitter:description" content="Analyze any paperwork, verify its legitimacy, build contracts, and review agreements before you sign — all in plain English. Free to start." />
    <meta name="twitter:image" content="https://plainpathapp.com/app/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://plainpathapp.com/app/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

kind = "web"
previewPath = "/plainpath-marketing/"
title = "PlainPath — Marketing Site"
version = "1.0.0"
id = "artifacts/plainpath-marketing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/plainpath-marketing/" ]
localPort = 18732

[services.development]
run = "pnpm --filter @workspace/plainpath-marketing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/plainpath-marketing", "run", "build" ]
publicDir = "artifacts/plainpath-marketing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18732"
BASE_PATH = "/plainpath-marketing/"

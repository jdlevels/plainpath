openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: PlainPath API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: documents
    description: Document processing operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /documents/analyze:
    post:
      operationId: analyzeDocument
      tags: [documents]
      summary: Analyze a document
      description: Extracts structured information from a document text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeDocumentRequest"
      responses:
        "200":
          description: Successful analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeDocumentResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /documents/demo/{demoId}:
    get:
      operationId: getDemoDocument
      tags: [documents]
      summary: Get a demo document result
      description: Returns pre-analyzed result for a built-in demo document
      parameters:
        - name: demoId
          in: path
          required: true
          schema:
            type: string
            enum: [event-permit, school-enrollment, grant-application]
      responses:
        "200":
          description: Demo document analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeDocumentResponse"
        "404":
          description: Demo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /documents/checklist:
    post:
      operationId: updateChecklist
      tags: [documents]
      summary: Update checklist item status
      description: Mark checklist items as complete/incomplete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChecklistRequest"
      responses:
        "200":
          description: Updated checklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateChecklistResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    AnalyzeDocumentRequest:
      type: object
      properties:
        text:
          type: string
          description: The document text to analyze
        title:
          type: string
          description: Optional title for the document
      required:
        - text

    ActionStep:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [high, medium, low]
        category:
          type: string
        completed:
          type: boolean
        sourceEvidence:
          type: string
          description: The excerpt from the original document that supports this step
        confidence:
          type: string
          enum: [high, medium, low]
      required:
        - id
        - title
        - description
        - priority
        - category
        - completed
        - confidence

    RequiredDocument:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        required:
          type: boolean
        obtained:
          type: boolean
        sourceEvidence:
          type: string
        confidence:
          type: string
          enum: [high, medium, low]
      required:
        - id
        - name
        - description
        - required
        - obtained
        - confidence

    Deadline:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        date:
          type: string
        description:
          type: string
        isHard:
          type: boolean
          description: Whether this is a hard (non-negotiable) deadline
        sourceEvidence:
          type: string
        confidence:
          type: string
          enum: [high, medium, low]
      required:
        - id
        - title
        - date
        - description
        - isHard
        - confidence

    FollowUpQuestion:
      type: object
      properties:
        id:
          type: string
        question:
          type: string
        context:
          type: string
        answered:
          type: boolean
        answer:
          type: string
      required:
        - id
        - question
        - context
        - answered

    RiskItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [high, medium, low]
        sourceEvidence:
          type: string
      required:
        - id
        - title
        - description
        - severity

    DocumentAnalysis:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
          description: Plain-English summary of what the document requires
        documentType:
          type: string
        actionSteps:
          type: array
          items:
            $ref: "#/components/schemas/ActionStep"
        requiredDocuments:
          type: array
          items:
            $ref: "#/components/schemas/RequiredDocument"
        deadlines:
          type: array
          items:
            $ref: "#/components/schemas/Deadline"
        followUpQuestions:
          type: array
          items:
            $ref: "#/components/schemas/FollowUpQuestion"
        risks:
          type: array
          items:
            $ref: "#/components/schemas/RiskItem"
        overallConfidence:
          type: string
          enum: [high, medium, low]
        processedAt:
          type: string
      required:
        - id
        - title
        - summary
        - documentType
        - actionSteps
        - requiredDocuments
        - deadlines
        - followUpQuestions
        - risks
        - overallConfidence
        - processedAt

    AnalyzeDocumentResponse:
      type: object
      properties:
        analysis:
          $ref: "#/components/schemas/DocumentAnalysis"
      required:
        - analysis

    UpdateChecklistRequest:
      type: object
      properties:
        sessionId:
          type: string
        itemId:
          type: string
        itemType:
          type: string
          enum: [actionStep, requiredDocument]
        completed:
          type: boolean
      required:
        - itemId
        - itemType
        - completed

    UpdateChecklistResponse:
      type: object
      properties:
        success:
          type: boolean
        itemId:
          type: string
        completed:
          type: boolean
      required:
        - success
        - itemId
        - completed

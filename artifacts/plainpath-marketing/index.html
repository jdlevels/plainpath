<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>PlainPath — Understand Any Document</title>
    <meta name="description" content="PlainPath turns confusing paperwork into a clear action plan — every step, deadline, and risk explained in plain English. Free to start." />
    <meta name="theme-color" content="#4F7CAC" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://plainpathapp.com/" />
    <meta property="og:title" content="PlainPath — Understand Any Document" />
    <meta property="og:description" content="Turn confusing paperwork into a clear action plan — every step, deadline, and risk explained in plain English. Free to start." />
    <meta property="og:image" content="https://plainpathapp.com/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="PlainPath" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://plainpathapp.com/" />
    <meta name="twitter:title" content="PlainPath — Understand Any Document" />
    <meta name="twitter:description" content="Turn confusing paperwork into a clear action plan — every step, deadline, and risk explained in plain English. Free to start." />
    <meta name="twitter:image" content="https://plainpathapp.com/opengraph.jpg" />

    <!-- Canonical -->
    <link rel="canonical" href="https://plainpathapp.com/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "name": "PlainPath",
          "url": "https://plainpathapp.com",
          "description": "PlainPath turns confusing paperwork into a clear action plan — every step, deadline, and risk explained in plain English.",
          "applicationCategory": "LegalApplication",
          "operatingSystem": "Web",
          "offers": [
            {
              "@type": "Offer",
              "name": "Pro",
              "price": "19.99",
              "priceCurrency": "USD",
              "description": "Analyze a Document and Contract Review — both tools, unlimited use."
            }
          ]
        },
        {
          "@type": "Organization",
          "name": "PlainPath",
          "url": "https://plainpathapp.com",
          "email": "support@plainpathapp.com",
          "description": "PlainPath helps everyday people understand their legal documents in plain English."
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Is PlainPath a replacement for a lawyer?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. PlainPath helps you understand your documents better, but it is not legal advice. For binding legal decisions, consult a licensed attorney."
              }
            },
            {
              "@type": "Question",
              "name": "Is my document data safe?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Documents are encrypted in transit, never sold, and never used to train AI models."
              }
            },
            {
              "@type": "Question",
              "name": "What types of documents can PlainPath analyze?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "PlainPath works with leases, employment contracts, NDAs, medical bills, IRS letters, eviction notices, business agreements, freelance contracts, and more."
              }
            },
            {
              "@type": "Question",
              "name": "How much does PlainPath cost?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "PlainPath Pro is $19.99/month and includes both tools — Analyze a Document and Contract Review — with a 7-day free trial."
              }
            }
          ]
        }
      ]
    }
    </script>

    <script>
      (function () {
        try {
          var t = localStorage.getItem('plainpath-marketing-theme');
          var resolved = t === 'dark' ? 'dark'
            : t === 'light' ? 'light'
            : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (resolved === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
